<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card payment-card p-4 shadow-lg border-0">
    <div class="row g-4">
      <div
        class="col-md-6 d-flex flex-column justify-content-center align-items-center bg-gradient-primary rounded-3 text-white p-4 card-visual-box"
      >
        <div class="credit-card-preview shadow">
          <div class="d-flex justify-content-between">
            <i class="bi bi-chip fs-2"></i>
            <i class="bi bi-layers-half fs-2"></i>
          </div>
          <div class="mt-4">
            <div class="fs-4 tracking-widest" id="v-number">#### #### #### ####</div>
          </div>
          <div class="d-flex justify-content-between mt-4">
            <div>
              <small class="text-white-50 d-block">Card Holder</small>
              <span id="v-name">YOUR NAME</span>
            </div>
            <div>
              <small class="text-white-50 d-block">Expires</small>
              <span id="v-expiry">MM/YY</span>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-6">
        <h4 class="mb-4 fw-bold">Add New Card</h4>
        <form>
          <div class="mb-3">
            <label class="form-label small fw-bold">CARDHOLDER NAME</label>
            <input
              type="text"
              class="form-control custom-input"
              id="nameInput"
              placeholder="e.g. John Doe"
            />
          </div>
          <div class="mb-3">
            <label class="form-label small fw-bold">CARD NUMBER</label>
            <input
              type="text"
              class="form-control custom-input"
              id="numberInput"
              placeholder="0000 0000 0000 0000"
            />
          </div>
          <div class="row">
            <div class="col-6 mb-3">
              <label class="form-label small fw-bold">EXPIRY DATE</label>
              <input
                type="text"
                class="form-control custom-input"
                id="expiryInput"
                placeholder="MM/YY"
              />
            </div>
            <div class="col-6 mb-3">
              <label class="form-label small fw-bold">CVV</label>
              <input type="password" class="form-control custom-input" placeholder="***" />
            </div>
          </div>
          <button class="btn btn-dark w-100 py-3 mt-3 fw-bold rounded-pill shadow-sm">
            Save Card
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
